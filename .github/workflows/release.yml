name: Build and release

# Tag push (v0.1.0, v0.2.0, ...) builds the jukebox AppImage and attaches it
# to that tag's release. "Run workflow" on the Actions tab builds it too and
# keeps it as a downloadable artifact, without making a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          check-latest: true

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfluidsynth3 libportaudio2 fluidr3mono-gm-soundfont \
            libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Python packages (latest versions, no pins)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # Every script is run through bash: the web upload drops the executable bit.
      - name: Smoke test
        run: bash build/smoke-test.sh

      - name: Build AppImage
        run: bash build/build-appimage.sh

      - name: AppImage selftest
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          chmod +x dist/Calder-Falls-Jukebox-x86_64.AppImage
          dist/Calder-Falls-Jukebox-x86_64.AppImage --selftest

      - name: Keep as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calder-Falls-Jukebox-x86_64.AppImage
          path: dist/Calder-Falls-Jukebox-x86_64.AppImage

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/Calder-Falls-Jukebox-x86_64.AppImage --clobber
          else
            gh release create "$tag" dist/Calder-Falls-Jukebox-x86_64.AppImage \
              --title "Calder Falls $tag" --notes "See changes.md for what changed."
          fi
