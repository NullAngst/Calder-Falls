name: Build and release

# Tag push (v0.2.0, v0.3.0, ...) builds the game and jukebox AppImages and
# attaches them to that tag's release. "Run workflow" on the Actions tab
# builds them too and keeps them as downloadable artifacts, without a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          check-latest: true

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfluidsynth3 libportaudio2 fluidr3mono-gm-soundfont \
            libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 unzip

      - name: Python packages (latest versions, no pins)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Latest inklecate
        run: |
          mkdir -p build/tools
          curl -fsSL -o build/tools/inklecate.zip \
            https://github.com/inkle/ink/releases/latest/download/inklecate_linux.zip
          unzip -o -q build/tools/inklecate.zip -d build/tools
          chmod +x build/tools/inklecate

      # Every script is run through bash: the web upload drops the executable bit.
      # The smoke test also compiles story/main.ink; any inklecate warning fails it.
      - name: Smoke test
        run: bash build/smoke-test.sh

      - name: Build AppImages
        run: bash build/build-appimage.sh both

      - name: AppImage selftests
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QT_QPA_PLATFORM: offscreen
          LC_ALL: C.UTF-8
          XDG_DATA_HOME: ${{ runner.temp }}/xdg
        run: |
          chmod +x dist/*.AppImage
          dist/Calder-Falls-x86_64.AppImage --selftest
          dist/Calder-Falls-Jukebox-x86_64.AppImage --selftest

      - name: Keep as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Calder-Falls-AppImages
          path: dist/*.AppImage

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.AppImage --clobber
          else
            gh release create "$tag" dist/*.AppImage \
              --title "Calder Falls $tag" --notes "See changes.md for what changed."
          fi
